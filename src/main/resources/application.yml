spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  servlet:
    multipart:
      max-file-size: 20MB

catalog:
  elasticsearch:
    url: ${ES_URL:http://localhost:9200}
    alias: products
  facet-attributes: color,size,material,capacity
  index-sync:
    enabled: true
    delay-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
